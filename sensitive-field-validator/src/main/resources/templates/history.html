<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History - Sensitive Field Validator</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/layout :: sidebar('history')}"></aside>

  <!-- Main Content Area -->
  <main class="main-content">
    <div class="page-header">
      <h1>Audit History 📜</h1>
      <p>Timestamped audit logs of all past field scans and CSV data uploads, newest first.</p>
    </div>

    <div class="card">
      <table th:if="${not #lists.isEmpty(results)}">
        <thead>
          <tr>
            <th>Timestamp</th>
            <th>Item / File</th>
            <th>Detection Result</th>
            <th>Sensitivity Status</th>
            <th>Masked Preview</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="r : ${results}">
            <td th:text="${r.formattedTimestamp}"></td>
            <td><strong th:text="${r.fieldName}"></strong></td>
            <td th:text="${r.detectedType}"></td>
            <td>
              <span class="badge badge-sensitive" th:if="${r.sensitive}">Sensitive</span>
              <span class="badge badge-clear" th:unless="${r.sensitive}">Not Sensitive</span>
            </td>
            <td style="font-family: monospace;" th:text="${r.maskedPreview}"></td>
          </tr>
        </tbody>
      </table>

      <div class="empty-state" th:if="${#lists.isEmpty(results)}">
        <div style="font-size: 2.5rem; margin-bottom: 12px; color: var(--muted);">📜</div>
        <h3>No scan history recorded yet</h3>
        <p>Go to the <a th:href="@{/data-loading}">Data Loading</a> page to upload your first CSV file.</p>
      </div>
    </div>
  </main>
</div>
</body>
</html>
