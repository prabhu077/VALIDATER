spring.application.name=sensitive-field-validator
server.port=8080

# Thymeleaf - caching off so template edits show without a restart (set to true outside development)
spring.thymeleaf.cache=false

# File upload limits (CSV uploads on the Data Loading page). Keep in sync with MAX_BYTES in static/js/script.js
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Uploaded datasets live in the HTTP session - expire idle sessions so they do not pile up in memory
server.servlet.session.timeout=30m

# Smaller HTML/CSS/JS responses
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,text/csv

# Content-hashed static URLs (style.css -> style-<hash>.css) so browsers can cache them for a long time
# and still pick up edits immediately. th:href="@{/css/style.css}" is rewritten automatically.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.cachecontrol.max-age=30d
